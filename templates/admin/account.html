{% extends "admin/base.html" %}
{% block studio %}
  <form method="post" class="panel stack narrow">
    {{ token() }}
    <h2>Change sign-in details</h2>
    <label>
      Username<input name="username"
                     autocomplete="username"
                     maxlength="80"
                     required
                     value="{{ username }}">
    </label>
    <label>
      Current password<input type="password" name="current" required autocomplete="current-password">
    </label>
    <label>
      New password<input type="password"
                         name="password"
                         required
                         minlength="12"
                         maxlength="256"
                         autocomplete="new-password">
    </label>
    <label>
      Confirm new password<input type="password"
                                 name="confirm"
                                 required
                                 minlength="12"
                                 maxlength="256"
                                 autocomplete="new-password">
    </label>
    <button class="btn primary">Update sign-in details</button>
  </form>
{% endblock %}
