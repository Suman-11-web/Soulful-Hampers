{% extends "base.html" %}
{% block content %}
  <div class="wrap page-body">
    <div class="panel login-panel">
      <p class="eyebrow">Studio access</p>
      <h1>Create the admin account</h1>
      <p>Use the single-use code from <code>instance/setup-code.txt</code> in your project folder.</p>
      <form class="stack" method="post">
        {{ token() }}<label>Setup code<input name="code" autocomplete="off" required maxlength="100">
        </label>
        <label>
          Choose a username<input name="username"
                                  autocomplete="username"
                                  value="{{ request.form.get('username', 'admin') }}"
                                  required
                                  maxlength="80">
        </label>
        <label>
          Choose a password<input type="password"
                                  name="password"
                                  autocomplete="new-password"
                                  required
                                  minlength="12"
                                  maxlength="256">
          <small>Use at least 12 characters.</small>
        </label>
        <label>
          Confirm password<input type="password"
                                 name="confirm"
                                 autocomplete="new-password"
                                 required
                                 minlength="12"
                                 maxlength="256">
        </label>
        <button class="btn primary">Create admin account</button>
      </form>
    </div>
  </div>
{% endblock %}
