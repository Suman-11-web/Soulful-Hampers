{% if rows %}
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Order</th>
          <th>Buyer</th>
          <th>Amount</th>
          <th>Payment</th>
          <th>Fulfilment</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        {% for r in rows %}
          <tr>
            <td>
              <a class="text-link" href="/admin/orders/{{ r.id }}">{{ r.id }}</a>
            </td>
            <td>{{ r.name }}</td>
            <td>{{ r.total|money }}</td>
            <td>
              <span class="status">{{ r.payment }}</span>
            </td>
            <td>{{ r.status }}</td>
            <td>{{ r.created|nice_date }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="table-empty">No orders to display.</p>
{% endif %}
